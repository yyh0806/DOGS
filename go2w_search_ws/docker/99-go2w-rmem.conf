# Go2W livox MID360 UDP 接收缓冲优化 (2026-07-16, 详见 memory livox-rmem-drop)
#
# 症状: livox /livox/lidar 硬件10Hz, 但高负载(YOLO+nav2+web 4核满载)时订阅侧掉到5.4Hz,
#        导致 fastlio TF jitter → nav2 extrapolation → follow_path halt cancel.
# 根因: 默认 net.core.rmem_max=212992(208KB) 对 MID360 ~24MB/s(2251 pkt/s) UDP 流只能缓冲
#        ~62ms, livox 接收线程被抢占超过 62ms 即 socket buffer 溢出(RcvbufErrors 活跃增长)丢帧.
#        (优先级 NI 只是放大器, CPU 不饱和18%时提 Nice 无效——实测推翻优先级假设)
#
# 部署到 NX:
#   sudo cp docker/99-go2w-rmem.conf /etc/sysctl.d/99-go2w-rmem.conf
#   sudo sysctl -p /etc/sysctl.d/99-go2w-rmem.conf
#   sudo systemctl restart livox-mid360-driver.service   # 重建 socket 才用新 buffer
#
# 验证 (go2w-web + YOLO 4 核满载下):
#   ros2 topic hz /livox/lidar  → 10.0Hz std<0.001s (修前 5.4Hz)
#   cat /proc/net/snmp | grep Udp  → RcvbufErrors 不再因 livox 增长
net.core.rmem_max = 33554432
net.core.rmem_default = 8388608
net.core.netdev_max_backlog = 10000
