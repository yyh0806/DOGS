# Go2W Search & Discover 默认配置
# ============================================================

# Go2W 桥接节点参数
bridge:
  ros__parameters:
    network_interface: ""          # 网卡名 (空=自动检测)
    robot_ip: "192.168.123.161"
    use_driving_mode: true         # Go2W 轮式模式
    stand_on_start: true           # 启动时自动站立
    cmd_timeout: 0.5               # 速度指令超时 (秒)
    publish_scan: true
    scan_rate: 10.0
    publish_odom: true
    odom_rate: 50.0
    publish_camera: true
    camera_rate: 10.0

# 检测器节点参数
detector:
  ros__parameters:
    camera_source: "rtsp://192.168.123.161:8554/camera"
    camera_fps: 15
    model_path: "yolov8n.pt"
    confidence: 0.45
    target_classes: []
    use_tensorrt: true
    save_images: true
    image_dir: "/tmp/go2w_detections"
    publish_annotated: true
    detect_interval: 0.1

# 任务编排器参数
orchestrator:
  ros__parameters:
    vlm_model: "Qwen/Qwen2.5-VL-3B-Instruct"
    whisper_model: "models/ggml-base.bin"
    whisper_language: "zh"
    default_search_width: 10.0
    default_search_height: 10.0
    default_search_spacing: 2.5
    nav_goal_timeout: 120.0
    auto_approach_detections: false

# Web 桥接参数
web_bridge:
  ros__parameters:
    host: "0.0.0.0"
    port: 8000
    ws_port: 8001
