# Nav2 参数 - Go2W + FAST_LIO 定位/建图 + 2D 激光避障
#
# 路线 (TECH_DECISIONS 第三节):
#   nx_sensor_node 将狗自带 utlidar 过滤为 /scan (LaserScan)
#   → local/global ObstacleLayer 做标记与清除 → InflationLayer 保留安全距离。
#   MID360 的 Livox CustomMsg 只供 FAST_LIO 定位/建图，不直接接入 Nav2 costmap。
#
# 定位: FAST_LIO 替代 amcl (不发 OccupancyGrid, 直接发 camera_init→body TF +
#       /Odometry)。Nav2 只消费 /Odometry, 不抢 map→odom TF。
#       因此 lifecycle 不激活 amcl / map_server / slam_toolbox。
#
# 阶段E 客户端契约 (D 服务端必须兼容):
#   - bt_navigator.global_frame = map (与 rooms.yaml frame_id + goal pose 一致)
#   - action 名默认 /navigate_to_pose (launch 不 remap)
#
# Go2W 室内差速起步 (max_vel_y=0.0), 跑通后可开全向 (max_vel_y=0.3, vy_samples=10)。
# 坐标系: /cmd_vel 走 REP-103 (linear.x 正=前进, angular.z 正=左转),
#         nx_motion_node 直接透传给 SDK Move(x,y,z), 零反转 (见 nav2_3d.launch.py 决策 5)。

bt_navigator:
  ros__parameters:
    global_frame: map                 # 阶段E 客户端 goal pose 的 frame_id, 必须一致
    robot_base_frame: base_link       # TF 树叶子, 与 TF 桥 (body→base_link) 一致
    odom_topic: /odom                 # map_odom_fuser 水平化后的 MID360 里程计
    bt_loop_duration: 10
    default_server_timeout: 20
    action_server_result_timeout: 900.0
    # Rewritten by nav2_3d.launch.py to our 2 Hz dynamic-replanning tree.
    # It has no Spin/BackUp recovery: an invalid or blocked goal fails in place.
    default_nav_to_pose_bt_xml: go2w_safe_dynamic_replan
    # Humble 必填: bt_navigator 要显式声明加载的 BT plugin 库列表,
    # 否则启动报错 "Failed to load BT plugin" 且 /navigate_to_pose 不暴露。
    # 列表取自 Nav2 Humble 官方 nav2_params.yaml (navigation_launch 默认 BT XML 用到的全部库)。
    plugin_lib_names:
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_and_track_route_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_route_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_controller_selector_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_get_pose_from_path_action_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_planner_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_speed_controller_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

controller_server:
  ros__parameters:
    controller_frequency: 5.0  # 2026-07-16 匹配 TF 5.9Hz (fastlio/fuser 实际发布率), 消除 extrapolation-into-future
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Nav2 原始控制量由 launch remap 进入 velocity_smoother；最终
    # /cmd_vel_nav 才到 motion 安全出口。
    FollowPath:
      # Sample a point ahead on the global path before handing control to DWB.
      # For a goal exactly behind the robot, raw DWB repeatedly crossed the
      # +/-pi wrap boundary and alternated left/right pure-turn commands. The
      # shim commits to the sampled path heading until the error is small.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      forward_sampling_distance: 0.5
      angular_dist_threshold: 0.05    # 降: 避免 RotationShim 预转向占主导导致原地转圈
      angular_disengage_threshold: 0.25
      rotate_to_heading_angular_vel: 0.5    # 提速 (原0.05极慢, livox稳定后放宽)
      max_angular_accel: 1.5
      simulate_ahead_time: 2.0
      rotate_to_goal_heading: false
      closed_loop: true
      debug_trajectory_details: false
      # Go2W 差速起步 (全向模式: max_vel_y=0.3, vy_samples=10)
      min_vel_x: 0.10        # 提速 (livox 10Hz 稳定后放宽, 原 0.05)
      min_vel_y: 0.0
      max_vel_x: 1.5        # 提速: livox rmem 修复后稳 10Hz, 原 0.3 是抖动时代保守值
      max_vel_y: 0.0        # 差速; 全向改 0.3
      max_vel_theta: 1.0    # Unitree Go2-W Move vyaw 上限 1.0 rad/s (官方文档 sports_services); nav2 不得超过 SDK 物理上限
      min_speed_xy: 0.05    # 允许慢速前进轨迹
      max_speed_xy: 1.6
      min_speed_theta: 0.15 # 纯旋转不得落入 Go2W 轮式死区 (现 < max_vel_theta, 区间有效)
      acc_lim_x: 1.2
      acc_lim_y: 0.0
      acc_lim_theta: 2.5    # 10Hz 下一周期即到 0.15；角速度上限仍为实测安全值
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 0         # 差速; 全向改 10
      vtheta_samples: 40
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5  # 有界 TF 等待窗口；时间同步由 fuser 的同时间戳校正保证
      xy_goal_tolerance: 0.10    # 短目标也必须产生可验证的机身位移
      yaw_goal_tolerance: 3.14   # Go2-W 纯转向会平移；目标朝向由搜索/云台单独处理
      critics: ["Oscillation", "ObstacleFootprint", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle checks only the robot center. This critic evaluates the
      # full 0.90 x 0.64 m rectangle at every sampled trajectory pose.
      ObstacleFootprint.scale: 0.02
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10    # 与 FollowPath.xy_goal_tolerance 一致
      yaw_goal_tolerance: 3.14   # 点选/探索目标不要求终点原地对向
      stateful: false            # 若滑出位置容差必须重新接近，不能只追逐朝向

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 1.0]   # vx≤1.5 m/s, vyaw≤1.0 rad/s (Unitree Go2-W Move SDK 上限, sports_services)
    min_velocity: [0.0, 0.0, -1.0]  # autonomous channel never reverses; vyaw 下限对齐 SDK (-1.0)
    max_accel: [1.2, 0.0, 2.5]      # 提速越过轮式转向死区
    max_decel: [-1.2, 0.0, -2.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0           # 实时 (rolling window 5×5m)
      publish_frequency: 2.0
      global_frame: odom              # rolling window 在 odom 系
      robot_base_frame: base_link
      transform_tolerance: 0.5  # 有界 TF 等待窗口，不用于掩盖陈旧变换
      rolling_window: true            # 滚动窗口 (狗动跟着动)
      width: 5                        # 5×5m 局部地图
      height: 5
      resolution: 0.05
      # Go2-W official standing envelope is 0.70 x 0.43 m.  Pad every side by
      # at least 0.10 m so wheels, turning sweep, scan latency and braking are
      # represented by the hard collision polygon rather than a soft score.
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.45, -0.32], [-0.45, 0.32] ]"
      # MID360 三维障碍点先进入 voxel layer，再做足迹膨胀。
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: mid360
        mid360:
          topic: /scan_mid360
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          expected_update_rate: 1.8
          observation_persistence: 0.3    # 2026-07-17 降到 0.3 (云台假点已在 bridge 源头滤除; persistence 仅清动态滞留, 2s 太长留 ghost)
          max_obstacle_height: 1.5
          min_obstacle_height: 0.0     # LaserScan z=0; source cloud was height-filtered
          obstacle_max_range: 7.0
          obstacle_min_range: 0.4     # 2026-07-16 剔近场自身/C13/载荷回波(假障碍), 原0.2     # 稍保守于 0.15m
          raytrace_max_range: 8.0
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Padded footprint turning radius is 0.552 m; preserve another 0.15 m
        # cost gradient so the controller prefers clearance before collision.
        inflation_radius: 0.30
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0           # 2026-07-18 D方案强clearing: scan raytrace clearing随update跑, 提频让ghost残留更快被清(原1.0省CPU但残留滞留); local是5Hz所以干净
      publish_frequency: 1.0
      global_frame: map               # 全局 frame, 与阶段E goal frame 一致
      robot_base_frame: base_link
      transform_tolerance: 0.5  # 有界 TF 等待窗口，不用于掩盖陈旧变换
      # Navfn has no path-orientation state.  Use the local padded rectangle's
      # circumscribed radius here so every possible wheel turning sweep is
      # protected while the global planner reasons about robot centers.
      robot_radius: 0.60
      resolution: 0.05
      track_unknown_space: true
      # 2026-07-17 治本(铁证, 推翻此前"先恢复1"的 static_layer): 去 static_layer.
      # probe2 实测 local_costmap 100% free (真实环境空), 但 global static_layer
      # (/map_frontier latched) 累积 FastLIO 抖动 ghost → 目标(-10.09,0.23) 落 ghost
      # 障碍 → Navfn planner_failed 4 连败 → 狗不动; 且 clear_entirely 清后 static 从
      # latched /map_frontier 重载 → 清不掉. 去 static 三解: ①ghost消失 ②clear生效
      # ③目标不被假障碍挡. rolling 30m (半径15m 覆盖目标~12.5m; 旧"目标28m"系误判),
      # obstacle_layer 实时 /scan_mid360 扫到空即清. 见 [[estop-web-shutdown-fastlio-jitter]].
      rolling_window: true
      width: 30
      height: 30
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: mid360
        mid360:
          topic: /scan_mid360
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          expected_update_rate: 1.8
          observation_persistence: 0.3    # 2026-07-17 降到 0.3 (云台假点已在 bridge 源头滤除; persistence 仅清动态滞留, 2s 太长留 ghost)
          max_obstacle_height: 1.5
          min_obstacle_height: 0.0     # LaserScan z=0; source cloud was height-filtered
          obstacle_max_range: 7.0
          obstacle_min_range: 0.4     # 2026-07-16 剔近场自身/C13/载荷回波(假障碍), 原0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"   # 简单够用, 室内小地图 OK; 未来换 SmacPlanner2D
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # Humble 已从 nav2_recoveries 迁移到 nav2_behaviors (新包名, 旧名废弃)。
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom               # recovery 行为在 odom frame
    robot_base_frame: base_link
    max_rotational_vel: 0.15         # 实测稳定响应值；0.2 会使 FastLIO 发散
    min_rotational_vel: 0.15         # 避免恢复动作落入轮式底盘死区
    rotational_acc_lim: 1.5          # 与 DWB/速度平滑器一致
    transform_tolerance: 0.5  # 有界 TF 等待窗口，不用于掩盖陈旧变换

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2.0
