# Nav2 参数 - Go2W + slam_toolbox 2D (slim 降级配置, 阶段F)
#
# 本文件是 nav2_params_3d.yaml 的 slam_toolbox 路线适配派生版 (spec-slam.md 决策 7)。
# diff 极小 (4 处有意差异, 其余逐字复制 3d 版):
#
#   ① bt_navigator.odom_topic: /odom         (3d 版 /Odometry, 因为 FAST_LIO 发大写;
#                                              slim 路线用 nx_sensor 的 /odom 小写)
#   ② local_costmap.plugins: 删 voxel_layer   (3d 版有 voxel_layer 吃 MID360 点云双保险;
#                                              slim 路线无 MID360, voxel_layer 订 /livox/lidar 无数据)
#   ③ obstacle_layer scan 段加 reliability: reliable  (两个 costmap 都加, 匹配 nx_sensor RELIABLE /scan;
#                                              Nav2 costmap obstacle_layer 默认 sensor_data QoS=BEST_EFFORT,
#                                              不匹配会静默收不到 /scan → 撞墙, 第二个 QoS 坑)
#   ④ global_costmap.static_layer 注释更新     (slim 路线 slam_toolbox 发 /map OccupancyGrid, 此层生效;
#                                              3d 版 FAST_LIO 不发 /map, 此层空)
#
# 不改 nav2_params_3d.yaml (阶段D 红线, commit 9b0c397 已 gan 收敛)。两文件并存,
# 由 nav2_3d.launch.py / nav2_slim.launch.py 分别加载。
#
# 阶段E 客户端契约 (slim 服务端也必须兼容, 与 3d 版一致):
#   - bt_navigator.global_frame = map (与 rooms.yaml frame_id + goal pose 一致)
#   - action 名默认 /navigate_to_pose (launch 不 remap)
#
# TF 链 (slim 路线, spec-slam.md 决策 3):
#   map ──(slam_toolbox)──▶ odom ──(nx_sensor)──▶ base_link, /scan 在 base_link 系
#   无 TF 桥 (与 3d 版的 map↔camera_init, body↔base_link static 不同)
#
# Go2W 室内差速起步, /cmd_vel 走 REP-103 零反转 (继承阶段D 决策 5, nav2_slim.launch.py 无 remap)。

bt_navigator:
  ros__parameters:
    global_frame: map                 # 阶段E 客户端 goal pose 的 frame_id, 必须一致
    robot_base_frame: base_link       # TF 树叶子, 与 nx_sensor odom→base_link 一致
    # 【slim diff ①】nx_sensor 发 /odom (小写, nx_sensor_node.py:106); 不是 FAST_LIO 的 /Odometry
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    action_server_result_timeout: 900.0
    # Humble 必填: bt_navigator 要显式声明加载的 BT plugin 库列表,
    # 否则启动报错 "Failed to load BT plugin" 且 /navigate_to_pose 不暴露。
    # 列表取自 Nav2 Humble 官方 nav2_params.yaml (与 3d 版逐字一致)。
    plugin_lib_names:
      - nav2_navttion_plugins::ComputePathToPose
      - nav2_navttion_plugins::ComputePathThroughPoses
      - nav2_navttion_plugins::SmoothPath
      - nav2_navttion_plugins::FollowPath
      - nav2_navttion_plugins::BackUp
      - nav2_navttion_plugins::Spin
      - nav2_navttion_plugins::Wait
      - nav2_navttion_plugins::DriveOnHeading
      - nav2_navttion_plugins::PlannerSelector
      - nav2_navttion_plugins::ControllerSelector
      - nav2_navttion_plugins::GoalCheckerSelector
      - nav2_navttion_plugins::ProgressCheckerSelector
      - nav2_navttion_plugins::NavigateToPoseNavigator
      - nav2_navttion_plugins::NavigateThroughPosesNavigator
      - nav2_navttion_plugins::RecoveryNode
      - nav2_navttion_plugins::PipelineSequence
      - nav2_navttion_plugins::RoundRobin
      - nav2_navttion_plugins::Sequence
      - nav2_navttion_plugins::RateController
      - nav2_navttion_plugins::DistanceController
      - nav2_navttion_plugins::TruncatePath
      - nav2_navttion_plugins::TruncatePathLocal
      - nav2_navttion_plugins::GoalReached

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controllers: ["FollowPath"]
    # /cmd_vel 默认 topic 名, 显式声明 (与 nx_motion_node 订阅 /cmd_vel 一致, 决策 5 零反转)。
    cmd_vel_topic: /cmd_vel
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Go2W 差速起步 (全向模式: max_vel_y=0.3, vy_samples=10)
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.6        # 室内安全速度 (TECH_DECISIONS 第三节)
      max_vel_y: 0.0        # 差速; 全向改 0.3
      max_vel_theta: 1.0    # 室内安全角速度 (TECH_DECISIONS 第三节)
      min_speed_xy: 0.1
      max_speed_xy: 0.6
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 0         # 差速; 全向改 10
      vtheta_samples: 40
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.20    # TECH_DECISIONS 第三节 Go2W 室内
      yaw_goal_tolerance: 0.15   # TECH_DECISIONS 第三节 Go2W 室内
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20    # 与 FollowPath.xy_goal_tolerance 一致
      yaw_goal_tolerance: 0.15   # 与 FollowPath.yaw_goal_tolerance 一致
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0           # 实时 (rolling window 5×5m)
      publish_frequency: 2.0
      global_frame: odom              # rolling window 在 odom 系
      robot_base_frame: base_link
      rolling_window: true            # 滚动窗口 (狗动跟着动)
      width: 5                        # 5×5m 局部地图
      height: 5
      resolution: 0.05
      footprint: "[ [0.30, 0.20], [0.30, -0.20], [-0.25, -0.20], [-0.25, 0.20] ]"
      # 【slim diff ②】删 voxel_layer: slim 路线无 MID360, voxel_layer 订 /livox/lidar 无数据。
      # 退化为单保险: obstacle_layer (吃 nx_sensor /scan) + inflation_layer。
      # (3d 版是 [obstacle, voxel, inflation] 双保险, 因为有 MID360 点云)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan                # 来自 nx_sensor (狗自带 LiDAR 投影, 不是 p2l)
          # 【slim diff ③】显式 RELIABLE 匹配 nx_sensor 发布端 (nx_sensor_node.py:107 RELIABLE)。
          # Nav2 costmap obstacle_layer 默认 sensor_data QoS = BEST_EFFORT, 不匹配会静默收不到 /scan
          # → costmap 无障碍 → 狗撞墙 (spec-slam.md §8.4 第二个 QoS 坑)。
          reliability: reliable
          durability: volatile
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 1.5
          min_obstacle_height: -0.1
          obstacle_max_range: 7.0     # 稍保守于 nx_sensor /scan range_max=10.0
          obstacle_min_range: 0.2     # 稍保守于 0.15m
          raytrace_max_range: 10.0    # 对齐 nx_sensor /scan range_max
          raytrace_min_range: 0.15
      # 【slim diff ②续】voxel_layer 整段删除 (slim 路线无 3D 点云源)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7         # Go2W footprint 最大 0.30m, 膨胀 0.7m 离墙 0.4m+ (室内门框够走)
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0           # 全局慢
      publish_frequency: 1.0
      global_frame: map               # 全局 frame, 与阶段E goal frame 一致
      robot_base_frame: base_link
      footprint: "[ [0.30, 0.20], [0.30, -0.20], [-0.25, -0.20], [-0.25, 0.20] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # 【slim diff ④】注释更新: slim 路线下 slam_toolbox 发 /map (OccupancyGrid),
        # 此层订阅 /map 有数据, 全局静态地图生效。
        # (3d 版 FAST_LIO 不发 OccupancyGrid, 此层是空层, costmap 靠 obstacle_layer 实时累积)
        map_subscribe_transient_local: true   # 匹配 slam_toolbox /map 的 TRANSIENT_LOCAL (latched) QoS
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan                # 来自 nx_sensor
          # 【slim diff ③】同 local_costmap, 匹配 nx_sensor RELIABLE /scan
          reliability: reliable
          durability: volatile
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 1.5
          min_obstacle_height: -0.1
          obstacle_max_range: 7.0
          obstacle_min_range: 0.2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"   # 简单够用, 室内小地图 OK; 未来换 SmacPlanner2D
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # Humble 已从 nav2_recoveries 迁移到 nav2_behaviors (新包名, 旧名废弃, 与 3d 版一致)。
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom               # recovery 行为在 odom frame
    robot_base_frame: base_link
    transform_tolerance: 0.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2.0
