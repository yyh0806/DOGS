<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Go2W 搜索控制台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* 顶栏 */
header { background: #141414; border-bottom: 1px solid #2a2a2a; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 15px; font-weight: 600; color: #fff; margin-right: 16px; }
.status-group { display: flex; gap: 14px; align-items: center; }
.status-item { font-size: 11px; color: #888; display: flex; align-items: center; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; background: #666; }
.status-dot.on { background: #4caf50; animation: pulse 2s infinite; }
.status-dot.warn { background: #ff9800; }
.status-dot.off { background: #666; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.pose-info { font-size: 11px; color: #aaa; font-family: monospace; }

/* 主体: 左地图 + 右栏 */
.main { display: flex; flex: 1; overflow: hidden; }

/* 左: 地图 (60%) */
.map-pane { flex: 6; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a; position: relative; }
.map-toolbar { background: #111; border-bottom: 1px solid #2a2a2a; padding: 6px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 11px; }
.map-toolbar .label { color: #666; }
.map-canvas-wrap { flex: 1; position: relative; background: #0a1520; overflow: hidden; }
#mapCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.map-hint { position: absolute; bottom: 8px; left: 12px; font-size: 10px; color: #546e7a; pointer-events: none; }
.map-source { position: absolute; top: 8px; right: 12px; font-size: 10px; color: #546e7a; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 3px; pointer-events: none; }

/* 右栏 (40%) */
.right-pane { flex: 4; display: flex; flex-direction: column; min-width: 300px; }
.section { border-bottom: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow: hidden; }
.section-header { padding: 8px 14px; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; background: #111; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }

/* 视频 */
.video-section { flex: 0 0 auto; }
.video-wrap { background: #000; position: relative; width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.video-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
.video-overlay { position: absolute; top: 6px; left: 6px; display: flex; gap: 6px; z-index: 3; }
.locate-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.locate-box { position: absolute; border: 2px solid #00e5ff; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,0.65), 0 0 16px rgba(0,229,255,0.45); }
.locate-box-label { position: absolute; left: -2px; top: -23px; max-width: 220px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: rgba(0,0,0,0.82); color: #e0f7fa; border: 1px solid rgba(0,229,255,0.7); border-radius: 3px; padding: 2px 6px; font-size: 11px; line-height: 16px; }
.locate-note { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(0,0,0,0.78); color: #ffd54f; border: 1px solid rgba(255,213,79,0.45); border-radius: 4px; padding: 5px 7px; font-size: 11px; line-height: 16px; }
.badge { background: rgba(0,0,0,0.7); padding: 2px 7px; border-radius: 3px; font-size: 10px; }
.badge.green { color: #4caf50; } .badge.orange { color: #ff9800; }
.no-video { color: #555; font-size: 12px; }

/* 检测列表 */
.det-list { padding: 6px 14px; max-height: 90px; overflow-y: auto; }
.det-item { font-size: 11px; color: #ff8a80; padding: 2px 0; display: flex; justify-content: space-between; }
.det-empty { color: #555; font-size: 11px; text-align: center; padding: 8px; }

/* 任务队列 */
.task-section { flex: 1; }
.task-list { flex: 1; overflow-y: auto; padding: 6px 14px; }
.task-empty { color: #555; font-size: 12px; text-align: center; padding: 20px; }
.task-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; margin-bottom: 3px; }
.task-item:hover { background: #1a1a1a; }
.task-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
.task-icon.pending { background: #1a237e; color: #7986cb; }
.task-icon.active { background: #e65100; color: #fff; animation: pulse 1.5s infinite; }
.task-icon.completed { background: #1b5e20; color: #81c784; }
.task-icon.failed { background: #b71c1c; color: #ef9a9a; }
.task-icon.cancelled { background: #333; color: #666; }
.task-info { flex: 1; min-width: 0; }
.task-type { font-size: 12px; color: #ddd; }
.task-params { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-status { font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.task-status.pending { color: #7986cb; } .task-status.active { color: #ff9800; } .task-status.completed { color: #81c784; } .task-status.failed { color: #ef9a9a; }

/* 底部控制区 */
.bottom { background: #141414; border-top: 1px solid #2a2a2a; flex-shrink: 0; }
.cmd-row { padding: 8px 14px; border-bottom: 1px solid #2a2a2a; }
.cmd-input-wrap { display: flex; gap: 6px; }
.cmd-input { flex: 1; padding: 7px 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 5px; color: #fff; font-size: 12px; outline: none; }
.cmd-input:focus { border-color: #1565c0; }
.cmd-input::placeholder { color: #555; }
.quick-cmds { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.quick-btn { padding: 3px 9px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; color: #aaa; font-size: 11px; cursor: pointer; }
.quick-btn:hover { border-color: #555; color: #fff; }

/* 搜索区域表单 */
.search-form { display: flex; gap: 6px; margin-top: 6px; align-items: center; font-size: 11px; flex-wrap: wrap; }
.search-form input { width: 42px; padding: 3px 5px; background: #1a1a1a; border: 1px solid #333; border-radius: 3px; color: #fff; font-size: 11px; text-align: center; }
.search-form .lbl { color: #666; }
.locate-form { display: flex; gap: 6px; margin-top: 6px; align-items: center; font-size: 11px; flex-wrap: wrap; }
.locate-form input { width: min(240px, 58vw); padding: 3px 6px; background: #1a1a1a; border: 1px solid #333; border-radius: 3px; color: #fff; font-size: 11px; outline: none; }
.locate-form input:focus { border-color: #1565c0; }
.locate-form .lbl { color: #666; }

/* 动作按钮栏 */
.action-row { padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.ctrl-group { display: flex; gap: 5px; align-items: center; }
.btn { padding: 6px 12px; border: 1px solid #333; background: #1a1a1a; color: #ccc; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.12s; user-select: none; }
.btn:hover { background: #252525; border-color: #555; color: #fff; }
.btn:active { transform: scale(0.96); }
.btn.primary { background: #1565c0; border-color: #1565c0; color: #fff; }
.btn.primary:hover { background: #1976d2; }
.btn.danger { background: #c62828; border-color: #c62828; color: #fff; }
.btn.danger:hover { background: #d32f2f; }
.btn.move-btn { background: #1b3a1b; border-color: #2e5a2e; color: #81c784; font-size: 15px; padding: 8px 0; width: 38px; text-align: center; border-radius: 5px; }
.btn.move-btn:hover { background: #2e5a2e; } .btn.move-btn:active { background: #4caf50; color: #fff; }
.move-pad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(2, 1fr); gap: 3px; margin-left: auto; }
.divider { width: 1px; height: 28px; background: #2a2a2a; }
.key-hint { padding: 5px 14px; font-size: 10px; color: #666; background: #0d0d0d; border-top: 1px solid #1a1a1a; flex-shrink: 0; }
.key-hint b { color: #aaa; font-weight: 600; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;">
    <h1>Go2W 搜索控制台</h1>
    <div class="status-group">
      <span class="status-item"><span class="status-dot off" id="dogDot"></span>狗 <b id="dogStateLabel" style="color:#888;font-family:monospace;">--</b></span>
      <span class="status-item"><span class="status-dot off" id="nxDot"></span>NX</span>
      <span class="status-item"><span class="status-dot off" id="slamDot"></span>SLAM</span>
    </div>
  </div>
  <div class="pose-info" id="poseInfo">位姿: --</div>
</header>

<div class="main">
  <!-- 左: 地图 -->
  <div class="map-pane">
    <div class="map-toolbar">
      <span class="label">地图</span>
      <button class="btn" style="padding:3px 9px;font-size:11px;" onclick="clearRegion()">清除选区</button>
      <button class="btn" style="padding:3px 9px;font-size:11px;" onclick="clearTrail()">清空轨迹</button>
      <span class="label" style="margin-left:auto;">提示: 地图上拖框选搜索区域</span>
    </div>
    <div class="map-canvas-wrap">
      <canvas id="mapCanvas"></canvas>
      <div class="map-source" id="mapSource">SLAM: 未连接</div>
      <div class="map-hint">世界坐标系 (米) · 网格=1m · 拖框选区</div>
    </div>
  </div>

  <!-- 右栏: 视频+检测 / 任务 -->
  <div class="right-pane">
    <div class="section video-section">
      <div class="section-header">云台 C13 (可见光+红外) <span id="videoMeta">--</span></div>
      <div class="video-wrap" id="visVideoWrap">
        <div class="video-overlay">
          <span class="badge green">可见光</span>
          <span class="badge green" id="fpsBadge">-- FPS</span>
          <span class="badge orange" id="detBadge">0 目标</span>
        </div>
        <span class="no-video" id="noVideo">等待视频...</span>
        <img id="videoImg" style="display:none" />
        <div class="locate-overlay" id="locateOverlay"></div>
      </div>
      <div class="video-wrap" style="height:130px;border-top:1px solid #2a2a2a;">
        <div class="video-overlay">
          <span class="badge" style="color:#ff5722;">红外</span>
        </div>
        <span class="no-video" id="noIrVideo">等待红外...</span>
        <img id="irImg" style="display:none" />
      </div>
      <div class="det-list" id="detList"><div class="det-empty">无检测</div></div>
    </div>

    <div class="section" style="flex:0 0 auto;">
      <div class="section-header">雷达 MID360 鸟瞰 <span id="lidarMeta" style="font-weight:400;color:#555;">--</span></div>
      <div style="background:#000;padding:4px;display:flex;justify-content:center;">
        <img id="lidarImg" style="max-width:100%;max-height:220px;display:none;" />
        <span class="no-video" id="noLidar">等待雷达...</span>
      </div>
    </div>

    <div class="section task-section">
      <div class="section-header">任务队列 <span id="taskCount" style="font-weight:400;color:#555;">0 待执行</span></div>
      <div class="task-list" id="taskList"><div class="task-empty">暂无任务</div></div>
    </div>
  </div>
</div>

<!-- 底部: 指令 + 搜索表单 + 动作 -->
<div class="bottom">
  <div class="cmd-row">
    <div class="cmd-input-wrap">
      <input class="cmd-input" id="cmdInput" placeholder="输入指令: 搜索前方10x10米找红色背包..." onkeydown="if(event.key==='Enter')sendCmd()" />
      <button class="btn primary" onclick="sendCmd()">发送</button>
    </div>
    <div class="search-form">
      <span class="lbl">或表单搜索:</span>
      <span class="lbl">宽</span><input type="number" id="searchW" value="8" step="0.5">
      <span class="lbl">高</span><input type="number" id="searchH" value="8" step="0.5">
      <span class="lbl">间距</span><input type="number" id="searchSpacing" value="2" step="0.5">
      <button class="btn" style="padding:3px 10px;" onclick="searchByForm()">从当前位置搜索</button>
    </div>
    <div class="locate-form">
      <span class="lbl">目标定位</span>
      <input id="locateInput" value="所有可见物体" onkeydown="if(event.key==='Enter')locateTarget()" />
      <button class="btn" style="padding:3px 10px;" onclick="locateTarget()">定位</button>
    </div>
    <div class="quick-cmds">
      <span class="quick-btn" onclick="quickCmd('搜索区域')">用选区搜索</span>
      <span class="quick-btn" onclick="quickCmd('前进两米')">前进</span>
      <span class="quick-btn" onclick="quickCmd('后退一米')">后退</span>
      <span class="quick-btn" onclick="quickCmd('左转90度')">左转</span>
      <span class="quick-btn" onclick="quickCmd('右转90度')">右转</span>
      <span class="quick-btn" onclick="quickCmd('停下来')">停止</span>
      <span class="quick-btn" onclick="quickCmd('返回起点')">返回</span>
    </div>
  </div>
  <div class="action-row">
    <div class="ctrl-group">
      <button class="btn primary" onclick="connect()">连接并站立</button>
      <button class="btn" onclick="stand()">站立</button>
      <button class="btn" onclick="sit()">坐下</button>
      <button class="btn danger" onclick="eStop()">急停</button>
    </div>
    <div class="divider"></div>
    <button class="btn" onclick="openFoxglove()" title="另开 Foxglove 看 nav2 原生数据">Foxglove</button>
    <div class="move-pad">
      <button class="btn move-btn" id="kQ" title="Q 左平移" onmousedown="move(0,0.3,0)" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="move(0,0.3,0)" ontouchend="stopMove()">←平</button>
      <button class="btn move-btn" id="kW" title="W/↑ 前进" onmousedown="move(0.4,0,0)" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="move(0.4,0,0)" ontouchend="stopMove()">↑</button>
      <button class="btn move-btn" id="kE" title="E 右平移" onmousedown="move(0,-0.3,0)" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="move(0,-0.3,0)" ontouchend="stopMove()">平→</button>
      <button class="btn move-btn" id="kA" title="A/← 左转" onmousedown="move(0,0,0.5)" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="move(0,0,0.5)" ontouchend="stopMove()">↺</button>
      <button class="btn move-btn" id="kS" title="S/↓ 后退" onmousedown="move(-0.4,0,0)" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="move(-0.4,0,0)" ontouchend="stopMove()">↓</button>
      <button class="btn move-btn" id="kD" title="D/→ 右转" onmousedown="move(0,0,-0.5)" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="move(0,0,-0.5)" ontouchend="stopMove()">↻</button>
    </div>
  </div>
  <div class="key-hint">键盘: <b>W/↑</b>前进 <b>S/↓</b>后退 <b>A/←</b>左转 <b>D/→</b>右转 <b>Q</b>左平移 <b>E</b>右平移 <b>1</b>站立 <b>2</b>坐下 <b>空格</b>急停 · (输入框聚焦时不响应)</div>
</div>

<script src="/map.js"></script>
<script>
let ws, connected = false, frameCount = 0, lastFpsTime = Date.now(), _moveInterval = null;
let latestDetections = [];
let latestLocateResult = null;
let map = null;

// ---- 地图初始化 ----
function initMap() {
  map = new Go2WMap(document.getElementById('mapCanvas'), {
    onSelectRegion: (region) => {
      // 拖框选区后, 同步到表单 + 提示
      document.getElementById('searchW').value = region.w.toFixed(1);
      document.getElementById('searchH').value = region.h.toFixed(1);
      console.log('[选区]', region);
    }
  });
  map.start();
}
function clearRegion() { if (map) map.clearRegion(); }
function clearTrail() { if (map) { map.slam.trail = []; } }

// ---- 运动控制 ----
// 速度档位 (偏稳, 后期可调): 前进0.4 后退0.4 转向0.5 平移0.3
const SPEED = { fwd: 0.4, turn: 0.5, strafe: 0.3 };
let pressedKeys = new Set();   // 当前按下的控制键
// _moveInterval 已在顶部 (line 206) 声明, 这里不重复声明

// 按当前 pressedKeys 合成速度并发送 (键盘控制专用)
function sendMoveFromKeys() {
  let vx = 0, vy = 0, vyaw = 0;
  if (pressedKeys.has('w') || pressedKeys.has('arrowup'))    vx  += SPEED.fwd;
  if (pressedKeys.has('s') || pressedKeys.has('arrowdown'))  vx  -= SPEED.fwd;
  if (pressedKeys.has('a') || pressedKeys.has('arrowleft'))  vyaw += SPEED.turn;
  if (pressedKeys.has('d') || pressedKeys.has('arrowright')) vyaw -= SPEED.turn;
  if (pressedKeys.has('q')) vy  += SPEED.strafe;
  if (pressedKeys.has('e')) vy  -= SPEED.strafe;
  // 多键组合直接发合成速度; 全松开则停
  if (vx === 0 && vy === 0 && vyaw === 0) stopMove();
  else fetch(`/api/move?vx=${vx}&vy=${vy}&vyaw=${vyaw}`, { method: 'POST' }).catch(() => {});
}

// 按钮拖拽控制 (onmousedown 持续, onmouseup/leave 停)
function move(vx, vy, vyaw) {
  clearInterval(_moveInterval);
  fetch(`/api/move?vx=${vx}&vy=${vy}&vyaw=${vyaw}`, { method: 'POST' });
  // RosRobotBridge 每次写stdin即时生效, 但保留低频续发以防丢包 (NX看门狗1s兜底)
  _moveInterval = setInterval(() => fetch(`/api/move?vx=${vx}&vy=${vy}&vyaw=${vyaw}`, { method: 'POST' }), 300);
}
function stopMove() { clearInterval(_moveInterval); _moveInterval = null; fetch('/api/stop', { method: 'POST' }); }
function connect() { fetch('/api/connect', { method: 'POST' }).then(r => r.json()).then(d => { if (d.ok) { connected = true; updateDogStatus(true); } }); }
function stand() { fetch('/api/stand', { method: 'POST' }); }
function sit() { fetch('/api/sit', { method: 'POST' }); }
function eStop() { clearInterval(_moveInterval); _moveInterval = null; pressedKeys.clear(); resetKeyHighlight(); fetch('/api/e_stop', { method: 'POST' }); }

// ---- 键盘控制 ----
const KEY_MAP = {
  'w':'kW','arrowup':'kW', 's':'kS','arrowdown':'kS',
  'a':'kA','arrowleft':'kA', 'd':'kD','arrowright':'kD',
  'q':'kQ', 'e':'kE'
};
function isTyping() {
  const a = document.activeElement;
  return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}
function highlightKey(btnId, on) {
  const el = document.getElementById(btnId);
  if (el) el.style.background = on ? '#4caf50' : '';
  if (el) el.style.color = on ? '#fff' : '';
}
function resetKeyHighlight() {
  ['kW','kS','kA','kD','kQ','kE'].forEach(id => highlightKey(id, false));
}
document.addEventListener('keydown', (e) => {
  if (isTyping()) return;            // 输入框内打字不触发
  const k = e.key.toLowerCase();
  if (k in KEY_MAP) {
    e.preventDefault();
    pressedKeys.add(k);
    highlightKey(KEY_MAP[k], true);
    sendMoveFromKeys();
  } else if (k === ' ' || k === 'spacebar') {
    e.preventDefault(); eStop();     // 空格急停
  } else if (k === '1' || k === 'pageup') { stand(); }
  else if (k === '2' || k === 'pagedown') { sit(); }
});
document.addEventListener('keyup', (e) => {
  if (isTyping()) return;
  const k = e.key.toLowerCase();
  if (k in KEY_MAP) {
    pressedKeys.delete(k);
    // 同组键(如w和arrowup)都松开才取消高亮
    const grp = KEY_MAP[k];
    const stillDown = Object.keys(KEY_MAP).some(kk => KEY_MAP[kk] === grp && pressedKeys.has(kk));
    if (!stillDown) highlightKey(grp, false);
    sendMoveFromKeys();
  }
});

// ---- 指令 ----
function sendCmd() {
  const input = document.getElementById('cmdInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
}
function quickCmd(text) { document.getElementById('cmdInput').value = text; sendCmd(); }

// 表单搜索: 从狗当前位置起, 按输入的宽高搜索
function searchByForm() {
  const w = parseFloat(document.getElementById('searchW').value) || 8;
  const h = parseFloat(document.getElementById('searchH').value) || 8;
  const sp = parseFloat(document.getElementById('searchSpacing').value) || 2;
  fetch(`/api/search?width=${w}&height=${h}&spacing=${sp}`, { method: 'POST' })
    .then(r => r.json()).then(d => { if (d.ok) { document.getElementById('taskCount').textContent = '搜索已启动'; } });
}

function locateTarget() {
  const input = document.getElementById('locateInput');
  const target = (input.value || '').trim();
  if (!target) return;
  const meta = document.getElementById('videoMeta');
  if (meta) meta.textContent = `定位中: ${target}`;
  fetch(`/api/locate?target=${encodeURIComponent(target)}`, { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      const result = d.result || {};
      result.target = d.target || result.target || target;
      if (Array.isArray(result.detections)) updateDetList(result.detections);
      renderLocateOverlay(result);
      if (meta) {
        const status = result.description || result.status || d.msg || (result.found ? 'found' : 'no detections');
        meta.textContent = result.found ? `定位: ${d.target || target}` : `定位未命中: ${status}`;
      }
    })
    .catch(() => {
      showLocateNote('LocateAnything: 请求未完成');
      if (meta) meta.textContent = '定位失败: 请求未完成';
    });
}

function openFoxglove() {
  fetch('/api/foxglove').then(r => r.json()).then(d => {
    if (d.url) window.open(d.url, '_blank');
    else alert('Foxglove bridge 未启动');
  }).catch(() => alert('Foxglove bridge 未启动'));
}

// ---- 状态更新 ----
function updateDogStatus(on) {
  const dot = document.getElementById('dogDot');
  dot.className = 'status-dot ' + (on ? 'on' : 'off');
}
function updateDogState(state) {
  // state: STOPPED/MOVING/STANDING/SITTING/SEATED/EMERGENCY/UNKNOWN
  const el = document.getElementById('dogStateLabel');
  if (!el) return;
  const colors = { STOPPED:'#4caf50', MOVING:'#ff9800', STANDING:'#2196f3',
                   SITTING:'#ff9800', SEATED:'#888', EMERGENCY:'#f44336', UNKNOWN:'#666' };
  el.textContent = state || '--';
  el.style.color = colors[state] || '#888';
  // 急停时狗状态点变红闪烁
  const dot = document.getElementById('dogDot');
  if (state === 'EMERGENCY') dot.className = 'status-dot warn';
  else if (state && state !== 'UNKNOWN') dot.className = 'status-dot on';
}
function updateSlamStatus(source) {
  const dot = document.getElementById('slamDot');
  const el = document.getElementById('mapSource');
  if (source && source !== 'none') { dot.className = 'status-dot on'; el.textContent = 'SLAM: ' + source; }
  else { dot.className = 'status-dot off'; el.textContent = 'SLAM: 未连接'; }
}

function updateTasks(data) {
  const el = document.getElementById('taskList');
  const countEl = document.getElementById('taskCount');
  const active = data.active;
  const pending = data.pending || [];
  let html = '';
  if (active) html += taskHTML(active);
  for (const t of pending) html += taskHTML(t);
  if (!html) html = '<div class="task-empty">暂无任务</div>';
  el.innerHTML = html;
  countEl.textContent = `${pending.length} 待执行`;
}
function taskHTML(t) {
  const icons = { navigate: '→', search_area: '◎', search_room: '⌂', follow: '◎', move: '→', stop: '■', return_home: '↩', observe: '◎', wait: '◎' };
  const typeNames = { navigate: '导航', search_area: '区域搜索', search_room: '房间搜索', follow: '跟踪', move: '移动', stop: '停止', return_home: '返回', observe: '观察', wait: '等待' };
  return `<div class="task-item"><div class="task-icon ${t.status}">${icons[t.type] || '?'}</div><div class="task-info"><div class="task-type">${typeNames[t.type] || t.type}</div><div class="task-params">${JSON.stringify(t.params).slice(0, 48)}</div></div><span class="task-status ${t.status}">${t.status}</span></div>`;
}
function updateDetList(dets) {
  const el = document.getElementById('detList');
  if (!el) return;
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
  const personNumber = (d, fallback) => {
    const rawId = d.person_id ?? d.id ?? '';
    const match = String(rawId).match(/(\d+)$/);
    return match ? String(Number(match[1])) : String(fallback + 1);
  };
  const displayLabel = (d, index) => {
    const raw = String(d.label_zh || d.label || d.class || d.name || d.type || '').trim();
    const key = String(d.class || d.label || d.type || '').toLowerCase();
    const isPerson = d.person_id !== undefined || key === 'person' || key === 'people' || key === 'person_marker';
    if (isPerson) return `人${personNumber(d, index)}`;
    return raw || '目标';
  };
  const displayMeta = (d) => {
    const conf = Number(d.confidence ?? d.score ?? d.probability);
    if (Number.isFinite(conf)) return `${Math.round(conf * 100)}%`;
    if (d.position_quality) return d.position_quality;
    if (Number.isFinite(Number(d.x)) && Number.isFinite(Number(d.y))) return `${Number(d.x).toFixed(1)}, ${Number(d.y).toFixed(1)}`;
    return '';
  };
  const safePhotoUrl = (d) => {
    const url = d.photo_url || d.crop_url || d.raw_url || '';
    return /^\s*javascript:/i.test(url) ? '' : url;
  };
  if (!Array.isArray(dets) || !dets.length) { el.innerHTML = '<div class="det-empty">无检测</div>'; return; }
  el.innerHTML = dets.map((d, index) => {
    const photoUrl = safePhotoUrl(d);
    const photo = photoUrl ? ` <a href="${escapeHtml(photoUrl)}" target="_blank" rel="noopener">照片</a>` : '';
    return `<div class="det-item"><span>${escapeHtml(displayLabel(d, index))}${photo}</span><span>${escapeHtml(displayMeta(d))}</span></div>`;
  }).join('');
}

function collectLocateBoxes(result) {
  if (!result) return [];
  const dets = Array.isArray(result.detections) ? result.detections : [];
  const boxes = dets
    .filter(d => Array.isArray(d.bbox) && d.bbox.length >= 4)
    .map(d => ({
      bbox: d.bbox,
      label: d.class || d.label || result.target || 'object',
      labelZh: d.label_zh || result.label_zh || '',
      confidence: d.confidence || result.confidence || 0,
      frameWidth: d.frame_width || result.frame_width,
      frameHeight: d.frame_height || result.frame_height,
    }));
  if (boxes.length) return boxes;
  if (Array.isArray(result.bbox) && result.bbox.length >= 4) {
    return [{
      bbox: result.bbox,
      label: result.label || result.target || 'object',
      labelZh: result.label_zh || '',
      confidence: result.confidence || 0,
      frameWidth: result.frame_width,
      frameHeight: result.frame_height,
    }];
  }
  return [];
}

function clampBox(bbox, frameW, frameH) {
  const [rawX1, rawY1, rawX2, rawY2] = bbox.map(Number);
  const x1 = Math.max(0, Math.min(frameW, rawX1));
  const y1 = Math.max(0, Math.min(frameH, rawY1));
  const x2 = Math.max(0, Math.min(frameW, rawX2));
  const y2 = Math.max(0, Math.min(frameH, rawY2));
  return [Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)];
}

function displayLocateLabel(boxData, index, total) {
  const rawZh = (boxData.labelZh || boxData.label_zh || '').trim();
  const raw = String(boxData.label || boxData.class || 'object').trim();
  const key = raw.toLowerCase();
  const zhMap = {
    object: '物体',
    objects: '物体',
    person: '人',
    people: '人',
    'person wearing white clothes': '白衣人',
    'person wearing black clothes': '黑衣人',
    'person wearing blue clothes': '蓝衣人',
    'person wearing red clothes': '红衣人',
    chair: '椅子',
    table: '桌子',
    desk: '桌子',
    door: '门',
    window: '窗户',
    car: '车',
    vehicle: '车',
    backpack: '背包',
    bag: '包',
    box: '箱子',
    bottle: '瓶子',
    cup: '杯子',
    screen: '屏幕',
  };
  const label = rawZh || zhMap[key] || raw || '物体';
  return total > 1 && label === '物体' ? `物体 ${index + 1}` : label;
}

function showLocateNote(text) {
  const overlay = document.getElementById('locateOverlay');
  if (!overlay) return;
  overlay.innerHTML = '';
  const note = document.createElement('div');
  note.className = 'locate-note';
  note.textContent = text;
  overlay.appendChild(note);
}

function renderLocateOverlay(result) {
  latestLocateResult = result || null;
  const overlay = document.getElementById('locateOverlay');
  if (!overlay) return;
  overlay.innerHTML = '';
  if (!result) return;

  const boxes = collectLocateBoxes(result);
  if (!result.found || !boxes.length) {
    const target = result.target ? `: ${result.target}` : '';
    const status = result.description || result.status || 'no detections';
    showLocateNote(`LocateAnything${target} - ${status}`);
    return;
  }

  const img = document.getElementById('videoImg');
  const wrap = overlay.parentElement;
  if (!img || !wrap) {
    showLocateNote('LocateAnything: 缺少可见光画面，无法画框');
    return;
  }

  const imgRect = img.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  if (imgRect.width <= 0 || imgRect.height <= 0) {
    showLocateNote('LocateAnything: 等待视频帧');
    return;
  }

  let drawn = 0;
  boxes.forEach((boxData, index) => {
    const frameW = Number(boxData.frameWidth) || 0;
    const frameH = Number(boxData.frameHeight) || 0;
    if (frameW <= 0 || frameH <= 0) return;
    const [x1, y1, x2, y2] = clampBox(boxData.bbox, frameW, frameH);
    if (x2 <= x1 || y2 <= y1) return;
    const left = imgRect.left - wrapRect.left + (x1 / frameW) * imgRect.width;
    const top = imgRect.top - wrapRect.top + (y1 / frameH) * imgRect.height;
    const width = Math.max(2, ((x2 - x1) / frameW) * imgRect.width);
    const height = Math.max(2, ((y2 - y1) / frameH) * imgRect.height);
    const box = document.createElement('div');
    box.className = 'locate-box';
    box.style.left = `${left}px`;
    box.style.top = `${top}px`;
    box.style.width = `${width}px`;
    box.style.height = `${height}px`;

    const label = document.createElement('div');
    label.className = 'locate-box-label';
    const conf = boxData.confidence ? ` ${Math.round(boxData.confidence * 100)}%` : '';
    label.textContent = `${displayLocateLabel(boxData, index, boxes.length)}${conf}`;
    box.appendChild(label);
    overlay.appendChild(box);
    drawn++;
  });
  if (!drawn) showLocateNote('LocateAnything: 缺少图像尺寸，无法画框');
}

// ---- WebSocket ----
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsUrl = `${proto}://${location.hostname}:8001`;
  ws = new WebSocket(wsUrl);
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'lidar') {
        const li = document.getElementById('lidarImg');
        li.src = 'data:image/png;base64,' + data.data;
        li.style.display = 'block';
        document.getElementById('noLidar').style.display = 'none';
        if (map && data.points) map.addLocalObstaclePoints(data.points);
        const meta = document.getElementById('lidarMeta');
        if (meta && data.points) meta.textContent = data.points.length + ' pts';
      } else if (data.type === 'gimbal') {
        // C13 云台双流 (可见光+红外合并推送)
        if (data.vis) {
          const img = document.getElementById('videoImg');
          img.src = 'data:image/jpeg;base64,' + data.vis;
          img.style.display = 'block';
          document.getElementById('noVideo').style.display = 'none';
          frameCount++;
          if (latestLocateResult) requestAnimationFrame(() => renderLocateOverlay(latestLocateResult));
        }
        if (data.ir) {
          const ir = document.getElementById('irImg');
          ir.src = 'data:image/jpeg;base64,' + data.ir;
          ir.style.display = 'block';
          document.getElementById('noIrVideo').style.display = 'none';
        }
      } else if (data.type === 'frame') {
        // 狗相机/YOLO 帧; videoImg 已由 type=gimbal.vis (云台可见光) 占用,
        // 狗没上电时 nx_ai 会切 mock 发灰底帧, 覆盖云台画面会闪烁 →
        // frame 只更新检测计数, 不写 videoImg (云台为主视频源)
        document.getElementById('detBadge').textContent = (data.detections || 0) + ' 目标';
        frameCount++;
      } else if (data.type === 'slam') {
        if (map) map.update(data.data);
        updateSlamStatus(data.data.slam_source);
        const d = data.data;
        document.getElementById('poseInfo').textContent = `位姿: x=${d.x.toFixed(2)} y=${d.y.toFixed(2)} yaw=${(d.yaw * 180 / Math.PI).toFixed(0)}°`;
      } else if (data.type === 'status') {
        if (data.tasks) updateTasks(data.tasks);
        if (data.connected !== undefined) { connected = data.connected; updateDogStatus(connected); }
        if (data.dog_state) updateDogState(data.dog_state);
        if (data.det_list) updateDetList(data.det_list);
      } else if (data.type === 'tasks') {
        updateTasks(data.data);
      } else if (data.type === 'vlm') {
        if (data.data.response) console.log('[VLM]', data.data.response);
      } else if (data.type === 'locate') {
        if (data.data && data.data.detections) updateDetList(data.data.detections);
        if (data.data) renderLocateOverlay(data.data);
        const meta = document.getElementById('videoMeta');
        if (meta && data.data) {
          meta.textContent = data.data.found
            ? `定位: ${data.data.target || ''}`
            : `定位未命中: ${data.data.status || '--'}`;
        }
      } else if (data.type === 'search') {
        // 搜索发现目标 → 在地图标记 (detMarks 已在 slam 里)
        if (data.data && data.data.found) console.log('[搜索发现]', data.data.found);
      } else if (data.type === 'person_markers') {
        const markers = data.data && Array.isArray(data.data.markers) ? data.data.markers : [];
        if (map) map.update({ person_markers: markers });
        updateDetList(markers);
      } else if (data.type === 'search_room') {
        console.log('[房间搜索]', data.data || {});
      } else if (data.type === 'mission_report') {
        const report = data.data || {};
        const detections = Array.isArray(report.detections) ? report.detections : [];
        if (map) map.update({ person_markers: detections });
        updateDetList(detections);
        console.log('[任务报告]', report);
      }
    } catch (err) { console.error('[WS] parse', err); }
  };
  ws.onclose = () => { clearInterval(_moveInterval); _moveInterval = null; setTimeout(connectWS, 2000); };
}

// ---- 启动 ----
initMap();
connectWS();
fetch('/api/stop', { method: 'POST' }); // 加载即停止, 防重连残留运动

// FPS
setInterval(() => {
  const now = Date.now();
  document.getElementById('fpsBadge').textContent = Math.round(frameCount / ((now - lastFpsTime) / 1000)) + ' FPS';
  frameCount = 0; lastFpsTime = now;
}, 1000);

// 状态轮询
setInterval(() => {
  fetch('/api/status').then(r => r.json()).then(d => {
    if (d.connected !== undefined) { connected = d.connected; updateDogStatus(connected); }
    if (d.tasks) updateTasks(d.tasks);
  }).catch(() => {});
}, 3000);

// 键盘控制
const keyState = {};
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (keyState[e.key]) return;
  keyState[e.key] = true;
  switch (e.key) {
    case 'ArrowUp': move(0.4, 0, 0); break;
    case 'ArrowDown': move(-0.4, 0, 0); break;
    case 'ArrowLeft': move(0, 0, 0.5); break;
    case 'ArrowRight': move(0, 0, -0.5); break;
  }
});
document.addEventListener('keyup', (e) => {
  if (e.target.tagName === 'INPUT') return;
  keyState[e.key] = false;
  if (!Object.values(keyState).some(v => v)) stopMove();
});
window.addEventListener('blur', () => { Object.keys(keyState).forEach(k => keyState[k] = false); stopMove(); });
window.addEventListener('resize', () => { if (latestLocateResult) renderLocateOverlay(latestLocateResult); });
</script>
