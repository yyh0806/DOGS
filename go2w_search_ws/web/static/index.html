<!-- ❌ DEPRECATED: 老前端(server.py 用), 已被 static/panel.html 取代, 不在运行链路中。
     保留仅供历史参考。新前端请用 static/panel.html。详见 docs/PROJECT_STRUCTURE.md。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go2W Search</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1923;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px;
    background: #1a2736;
    border-bottom: 1px solid #2d4052;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #00e5ff; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px;
  }
  .status-dot.online { background: #00c853; box-shadow: 0 0 8px #00c853; }
  .status-dot.offline { background: #ff1744; }
  .status-dot.searching { background: #ff9100; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .views {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 24px;
    min-height: 0;
  }
  .view-card {
    background: #1a2736;
    border: 1px solid #2d4052;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .view-label {
    padding: 8px 14px;
    font-size: 12px; font-weight: 600;
    color: #90a4ae;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #2d4052;
    display: flex; align-items: center; justify-content: space-between;
  }
  .view-body {
    flex: 1;
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .view-body img, .view-body canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .no-signal { color: #546e7a; font-size: 13px; }
  .det-overlay {
    position: absolute; top: 6px; left: 8px;
    background: rgba(0,0,0,0.65);
    padding: 3px 8px; border-radius: 4px;
    font-size: 11px; color: #00e5ff;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 14px 24px;
    background: #1a2736;
    border-top: 1px solid #2d4052;
    flex-shrink: 0;
  }
  .btn {
    padding: 10px 40px; border: none; border-radius: 6px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.15s; letter-spacing: 1px;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-search { background: #00c853; color: #000; min-width: 160px; }
  .btn-search:hover:not(:disabled) { background: #33d977; }
  .btn-stop { background: #ff1744; color: #fff; min-width: 160px; }
  .btn-stop:hover:not(:disabled) { background: #ff4569; }
  .search-info {
    font-size: 12px; color: #90a4ae; min-width: 200px; text-align: center;
  }

  .toast-container {
    position: fixed; bottom: 70px; right: 20px; z-index: 999;
    display: flex; flex-direction: column; gap: 6px;
  }
  .toast {
    padding: 8px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 500;
    animation: slideIn 0.3s ease;
  }
  .toast.success { background: #00c853; color: #000; }
  .toast.error { background: #ff1744; color: #fff; }
  .toast.info { background: #1565c0; color: #fff; }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
</style>
</head>
<body>

<header>
  <h1>Go2W Search</h1>
  <div>
    <span class="status-dot offline" id="statusDot"></span>
    <span style="font-size:13px;color:#90a4ae" id="statusText">未连接</span>
  </div>
</header>

<div class="views">
  <div class="view-card">
    <div class="view-label">
      <span>第一视角</span>
      <span id="fpsLabel" style="font-size:10px;color:#546e7a">--</span>
    </div>
    <div class="view-body" id="fpvBody">
      <span class="no-signal" id="fpvNoSignal">等待连接...</span>
      <img id="fpvImg" style="display:none" />
      <div class="det-overlay" id="detOverlay" style="display:none">
        目标: <span id="detCount">0</span>
      </div>
    </div>
  </div>

  <div class="view-card">
    <div class="view-label">
      <span>SLAM 建图</span>
      <span id="slamInfo" style="font-size:10px;color:#546e7a">--</span>
    </div>
    <div class="view-body" id="slamBody">
      <canvas id="slamCanvas"></canvas>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-search" id="btnSearch" onclick="doSearch()">搜 索</button>
  <div class="search-info" id="searchInfo">就绪</div>
  <button class="btn btn-stop" id="btnStop" onclick="doStop()">停 止</button>
</div>

<div class="toast-container" id="toasts"></div>

<script>
const WS_URL = `ws://${location.hostname}:8001`;
let ws = null;
let connected = false;
let frameCount = 0;
let lastFpsTime = Date.now();

// SLAM 状态
const slam = {
  robotX: 0, robotY: 0, robotYaw: 0,
  trail: [],
  detMarks: [],
  waypoints: [],
  currentWP: -1,
  mapPoints: [],     // 累积栅格地图 [(x,y), ...] 世界坐标
  scanPoints: [],    // 当前帧实时扫描 [(x,y), ...] 机器人局部坐标
};

// ============ WebSocket ============
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    setInterval(() => { if(ws && ws.readyState===1) ws.send('ping'); }, 5000);
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'frame') handleFrame(msg);
      else if (msg.type === 'slam') handleSlam(msg.data);
      else if (msg.type === 'status') handleStatus(msg.data);
      else if (msg.type === 'detection') handleDetection(msg.data);
    } catch(err) {}
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onerror = () => {};
}

function handleFrame(msg) {
  const img = document.getElementById('fpvImg');
  const noSig = document.getElementById('fpvNoSignal');
  img.src = 'data:image/jpeg;base64,' + msg.image;
  img.style.display = 'block';
  noSig.style.display = 'none';

  const overlay = document.getElementById('detOverlay');
  const count = document.getElementById('detCount');
  if (msg.detections && msg.detections.length > 0) {
    overlay.style.display = 'block';
    count.textContent = msg.detections.length;
  } else {
    overlay.style.display = 'none';
  }

  frameCount++;
  const now = Date.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fpsLabel').textContent = frameCount + ' fps';
    frameCount = 0;
    lastFpsTime = now;
  }
}

function handleSlam(data) {
  if (data.x !== undefined) slam.robotX = data.x;
  if (data.y !== undefined) slam.robotY = data.y;
  if (data.yaw !== undefined) slam.robotYaw = data.yaw;
  if (data.trail) slam.trail = data.trail;
  if (data.detections) slam.detMarks = data.detections;
  if (data.waypoints && data.waypoints.length) slam.waypoints = data.waypoints;
  if (data.currentWP !== undefined) slam.currentWP = data.currentWP;
  if (data.map) slam.mapPoints = data.map;
  if (data.scan) slam.scanPoints = data.scan;
  drawSlam();
}

function handleStatus(data) {
  const info = document.getElementById('searchInfo');
  const dot = document.getElementById('statusDot');
  if (data.status === 'searching') {
    info.textContent = `搜索中 ${data.current || 0}/${data.total || '?'} — 目标: ${slam.detMarks.length}`;
    dot.className = 'status-dot searching';
    document.getElementById('btnSearch').disabled = true;
    document.getElementById('btnStop').disabled = false;
  } else if (data.status === 'completed') {
    info.textContent = `搜索完成 — 发现 ${slam.detMarks.length} 个目标`;
    dot.className = 'status-dot online';
    document.getElementById('btnSearch').disabled = false;
    document.getElementById('btnStop').disabled = false;
    toast('搜索完成!', 'success');
  } else if (data.status === 'stopped') {
    info.textContent = '已停止';
    dot.className = 'status-dot online';
    document.getElementById('btnSearch').disabled = false;
    document.getElementById('btnStop').disabled = false;
  } else if (data.status === 'error') {
    info.textContent = '错误: ' + (data.error || '');
    dot.className = 'status-dot online';
    document.getElementById('btnSearch').disabled = false;
    document.getElementById('btnStop').disabled = false;
  }
}

function handleDetection(det) {
  toast(`${det.class} ${(det.confidence*100).toFixed(0)}%`, 'success');
}

// ============ SLAM Canvas ============
function drawSlam() {
  const canvas = document.getElementById('slamCanvas');
  const body = document.getElementById('slamBody');
  canvas.width = body.clientWidth;
  canvas.height = body.clientHeight;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#0a1520';
  ctx.fillRect(0, 0, W, H);

  // ---- 计算视野范围 ----
  // 以机器人为中心，同时包含地图点和轨迹
  const SCAN_RANGE = 8.0;
  let allX = [slam.robotX, 0], allY = [slam.robotY, 0];
  for (const p of slam.mapPoints) { allX.push(p[0]); allY.push(p[1]); }
  for (const t of slam.trail) { allX.push(t[0]); allY.push(t[1]); }
  for (const wp of slam.waypoints) { allX.push(wp.x); allY.push(wp.y); }
  for (const d of slam.detMarks) { allX.push(d.x); allY.push(d.y); }

  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minY = Math.min(...allY), maxY = Math.max(...allY);
  const rangeX = Math.max(maxX - minX, SCAN_RANGE * 2);
  const rangeY = Math.max(maxY - minY, SCAN_RANGE * 2);
  const margin = 2.0;
  const scale = Math.min(W / (rangeX + margin * 2), H / (rangeY + margin * 2));
  // 视野中心：偏向机器人位置，同时让地图点可见
  const worldCX = (minX + maxX) / 2;
  const worldCY = (minY + maxY) / 2;
  const cx = W / 2 - worldCX * scale;
  const cy = H / 2 + worldCY * scale;

  function toX(wx) { return cx + wx * scale; }
  function toY(wy) { return cy - wy * scale; }
  const rx = toX(slam.robotX), ry = toY(slam.robotY);

  // ---- 背景网格 ----
  ctx.strokeStyle = '#152230';
  ctx.lineWidth = 1;
  const gMin = Math.floor(Math.min(minX, 0) - margin);
  const gMax = Math.ceil(Math.max(maxX, 0) + margin);
  for (let gx = gMin; gx <= gMax; gx++) {
    ctx.beginPath(); ctx.moveTo(toX(gx), 0); ctx.lineTo(toX(gx), H); ctx.stroke();
  }
  for (let gy = gMin; gy <= gMax; gy++) {
    ctx.beginPath(); ctx.moveTo(0, toY(gy)); ctx.lineTo(W, toY(gy)); ctx.stroke();
  }
  ctx.fillStyle = '#2a3a48';
  ctx.font = '9px sans-serif';
  for (let gx = gMin; gx <= gMax; gx++) {
    ctx.fillText(gx + 'm', toX(gx) + 2, toY(0) - 2);
  }
  for (let gy = gMin; gy <= gMax; gy++) {
    if (gy !== 0) ctx.fillText(gy + 'm', toX(0) + 2, toY(gy) - 2);
  }

  // ---- 1. 累积栅格地图（橙色小点 = 障碍物） ----
  if (slam.mapPoints.length > 0) {
    ctx.fillStyle = 'rgba(255,145,0,0.7)';
    for (const p of slam.mapPoints) {
      ctx.fillRect(toX(p[0]) - 1, toY(p[1]) - 1, 2, 2);
    }
  }

  // ---- 2. 实时扫描射线（绿色细线） ----
  if (slam.scanPoints.length > 0) {
    const yaw = slam.robotYaw;
    const cosY = Math.cos(yaw);
    const sinY = Math.sin(yaw);

    // 射线
    ctx.strokeStyle = 'rgba(0,230,118,0.12)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (const pt of slam.scanPoints) {
      const wx = cosY * pt[0] - sinY * pt[1] + slam.robotX;
      const wy = sinY * pt[0] + cosY * pt[1] + slam.robotY;
      ctx.moveTo(rx, ry);
      ctx.lineTo(toX(wx), toY(wy));
    }
    ctx.stroke();

    // 扫描点（亮绿色圆点）
    ctx.fillStyle = 'rgba(0,255,136,0.8)';
    for (const pt of slam.scanPoints) {
      const wx = cosY * pt[0] - sinY * pt[1] + slam.robotX;
      const wy = sinY * pt[0] + cosY * pt[1] + slam.robotY;
      ctx.beginPath();
      ctx.arc(toX(wx), toY(wy), 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- 3. 规划路径（虚线） ----
  const wps = slam.waypoints;
  if (wps.length > 0) {
    ctx.strokeStyle = '#2d4052';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(0));
    for (const wp of wps) ctx.lineTo(toX(wp.x), toY(wp.y));
    ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < wps.length; i++) {
      ctx.fillStyle = '#3d5062';
      ctx.beginPath();
      ctx.arc(toX(wps[i].x), toY(wps[i].y), 3, 0, Math.PI * 2);
      ctx.fill();
    }
    if (slam.currentWP >= 0 && slam.currentWP < wps.length) {
      const cw = wps[slam.currentWP];
      ctx.strokeStyle = '#ff9100';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(toX(cw.x), toY(cw.y), 7, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ---- 4. 机器人轨迹（青色线条） ----
  if (slam.trail.length > 1) {
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(toX(slam.trail[0][0]), toY(slam.trail[0][1]));
    for (let i = 1; i < slam.trail.length; i++) {
      ctx.lineTo(toX(slam.trail[i][0]), toY(slam.trail[i][1]));
    }
    ctx.stroke();
  }

  // ---- 5. 检测目标（红三角） ----
  for (const det of slam.detMarks) {
    ctx.fillStyle = '#ff1744';
    const dx = toX(det.x), dy = toY(det.y);
    ctx.beginPath();
    ctx.moveTo(dx, dy - 8);
    ctx.lineTo(dx - 6, dy + 5);
    ctx.lineTo(dx + 6, dy + 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px sans-serif';
    ctx.fillText(det.class, dx + 8, dy + 3);
  }

  // ---- 6. 机器人（箭头） ----
  const yaw = slam.robotYaw;
  ctx.save();
  ctx.translate(rx, ry);
  ctx.rotate(-yaw);
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(-7, -7);
  ctx.lineTo(-4, 0);
  ctx.lineTo(-7, 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 起点
  ctx.strokeStyle = '#00c853';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(toX(0), toY(0), 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#00c853';
  ctx.font = '9px sans-serif';
  ctx.fillText('START', toX(0) + 8, toY(0) + 3);

  // 距离圈
  ctx.strokeStyle = 'rgba(0,229,255,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  for (let r = 2; r <= SCAN_RANGE; r += 2) {
    ctx.beginPath();
    ctx.arc(rx, ry, r * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,229,255,0.25)';
    ctx.font = '8px sans-serif';
    ctx.fillText(r + 'm', rx + r * scale + 2, ry - 2);
  }
  ctx.setLineDash([]);

  // 信息栏
  document.getElementById('slamInfo').textContent =
    `(${slam.robotX.toFixed(2)}, ${slam.robotY.toFixed(2)}) ${(slam.robotYaw * 180 / Math.PI).toFixed(1)}° | 地图:${slam.mapPoints.length} 扫描:${slam.scanPoints.length} 目标:${slam.detMarks.length}`;
}

// ============ API ============
async function apiPost(path) {
  try {
    const res = await fetch(path, {method:'POST'});
    return await res.json();
  } catch(e) {
    toast('请求失败: ' + e.message, 'error');
    return null;
  }
}

async function doSearch() {
  document.getElementById('btnSearch').disabled = true;
  document.getElementById('searchInfo').textContent = '正在启动...';
  const res = await apiPost('/api/search');
  if (res && res.success) {
    toast('搜索任务已启动', 'info');
    document.getElementById('btnStop').disabled = false;
  } else {
    toast(res?.error || '启动失败', 'error');
    document.getElementById('btnSearch').disabled = false;
  }
}

async function doStop() {
  const res = await apiPost('/api/stop');
  if (res) toast('已停止', 'info');
  document.getElementById('btnSearch').disabled = false;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('searchInfo').textContent = '已停止';
}

function setConnected(val) {
  connected = val;
  document.getElementById('statusDot').className = 'status-dot ' + (val ? 'online' : 'offline');
  document.getElementById('statusText').textContent = val ? '已连接' : '未连接';
  document.getElementById('btnSearch').disabled = !val;
}

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============ Init ============
connectWS();
setTimeout(drawSlam, 500);
window.addEventListener('resize', drawSlam);

setInterval(async () => {
  try {
    const res = await fetch(new URL('/api/status', location.origin));
    const data = await res.json();
    if (data) setConnected(data.connected);
  } catch(e) {}
}, 3000);
</script>
</body>
</html>
